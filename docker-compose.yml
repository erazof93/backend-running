services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: runner_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: running_app
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      TZ: "UTC"
    ports:
      # Host 5433 -> contenedor 5432 (5432 del host lo usa otro proyecto)
      - "5433:5432"
    volumes:
      # Guardar datos persistentes entre reinicios
      - postgres_data:/var/lib/postgresql/data
      # Inicialización opcional
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d running_app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - runner_network
    restart: unless-stopped
 
  # NestJS Backend
  # NOTA: requiere un Dockerfile en la raiz (aun no existe). Levanta este
  # servicio con `docker compose up -d backend` cuando el Dockerfile este listo.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: development
    container_name: runner_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # NestJS Configuration
      NODE_ENV: development
      ENVIRONMENT: development
      
      # Database (red interna de Docker: sigue siendo puerto 5432)
      DATABASE_URL: postgresql://user:password@postgres:5432/running_app
      
      # JWT
      JWT_SECRET: dev_secret_key_change_in_production_now
      JWT_REFRESH_SECRET: dev_refresh_secret_key_change_in_production_now
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_EXPIRES_IN: 7d
      
      # API
      API_PORT: 3000
      API_HOST: 0.0.0.0
      API_PREFIX: /api/v1
      
      # CORS
      CORS_ORIGIN: "http://localhost:3000,http://localhost:8080,http://localhost:5173,http://localhost:4200"
      
      # Logging
      LOG_LEVEL: debug
      
      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
    
    ports:
      - "3000:3000"
    
    volumes:
      # Hot reload para desarrollo
      - .:/app
      - /app/node_modules
      - /app/dist
    
    command: npm run start:dev
    
    networks:
      - runner_network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
 
  # Adminer - GUI para PostgreSQL (opcional)
  adminer:
    image: adminer:latest
    container_name: runner_adminer
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    networks:
      - runner_network
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    restart: unless-stopped
    # Acceder a: http://localhost:8080
    # Sistema: PostgreSQL
    # Servidor: postgres
    # Usuario: user
    # Contraseña: password
    # Base de datos: running_app
 
networks:
  runner_network:
    driver: bridge
 
volumes:
  postgres_data:
    driver: local